nschlägige <strong>Berufserfahrung </strong>im Service Delivery Management, IT-Kundenmanagement oder IT-Vertrieb</li>        <li>Erfahrung mit <strong>IT Infrastrukturen und Managed Services </strong>(Rechenzentrumsbetrieb, Netzwerkinfrastruktur, Collaboration Services, Clientmanagement)</li>        <li><strong>ITIL Kenntnisse </strong>und gutes technisches Verständnis von IT Services</li>        <li>Ausgeprägte Kommunikationsfähigkeit, <strong>Kundenorientierung</strong> und lösungsorientierte Arbeitsweise</li>        <li>Sehr gute <strong>Deutschkenntnisse </strong>in Wort und Schrift</li>       </ul>     </div>      <h3>Benefits</h3>      <div>      <ul>        <li><strong>Flexible Arbeitszeiten</strong>&nbsp;und bis zu&nbsp;<strong>60% Homeofficemöglichkeit</strong></li>        <li>Arbeiten mit innovativen Technologien an einem zentral gelegenen Standort</li>        <li>Weiterführende Schulungsangebote und Zertifizierungen</li>        <li><strong>Mitarbeiterrabatte</strong>&nbsp;und Essenszuschüsse</li>        <li>Fitnessangebote und&nbsp;<strong>Gesundheitsvorsorge</strong></li>       </ul>       <p><strong>﻿</strong>Neben diesen unterschiedlichen Benefits &amp; Goodies erwartet Sie ein Bruttojahresgehalt&nbsp;<strong>ab EUR 83.000,-</strong>&nbsp;sowie die Bereitschaft zur Überbezahlung je nach Qualifikation und Erfahrung.&nbsp;<strong>Lass uns gerne darüber sprechen!</strong></p>     </div>      <div>       <div>        Bewerben Sie sich bei uns unter <a href=\"https://iventajobdata.eu/bestmedia/img/2586276/2044183/cl/d5f52b4c880b79df4b1d1d3108f869c6bcfbbb97/L10860184/JeyJvbGRsaW5rIjoiaHR0cHM6Ly93d3cuaXZlbnRhLmV1L2Jld2VyYmVycG9ydGFsL2Jld2VyYmVuL2pvYi8yMDI2LTAyNzMyLyIsInpsIjoiZGVyU3RhbmRhcmQuYXQifQ==\" target=\"_blank\" rel=\"nofollow\" class=\"InListingLink\">www.iventa.eu/bewerberportal/offene-jobs</a> mit Angabe der Ref.-Nr. <span>2026-02732</span>. Wir freuen uns darauf, Sie erfolgreich zu vernetzen!        <p>        </p><div>         <div>          <div>
