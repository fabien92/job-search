# JobBot — Telegram message texts, in English (reference language and default).
# Every other locales/<code>.yaml has the same keys; a key missing there falls back to this file.
# {name} = value inserted by the code; write {{ or }} for a literal brace.
# Telegram HTML allowed: <b>, <i>, <code>, <a href>. Write &lt; and &gt; for < and >.
# Language chosen with /lang (saved in state/settings.json).

lang:
  self_name: "English"
  current: "Language: <b>{name}</b> ({code}). Change: /lang {choices}"
  set: "Language: <b>{name}</b>. JobBot now writes in English."
  unknown: "Unknown language: {code}. Choices: {choices}"

bot:
  busy: "State busy (lock); try again in a moment."
  error: "Error: {name}"
  unknown_command: "Unknown command. /help"
  corrupt_state: "⚠️ State file <code>{file}</code> is unreadable (invalid JSON). Nothing was changed. Restore it from the backup or repair it by hand, then try again."
  tracker_malformed: "⚠️ Tracker not updated: the row at line {line} ({company}) has more cells than the header (an unquoted comma?). Repair job_search_tracker.csv, then send the command again."
  needs_claude: "This command needs Claude: it is unavailable with <code>scoring: rules</code> (see schedule.yaml)."

help:
  text: |-
    <b>JobBot — commands</b>
    /search &lt;site|all&gt; — search now ({portals}, all)
    /no &lt;ID&gt; [reason] — reject the posting; the reason (optional) is added to rejection-rules.md; shown posting → the next one follows
    /queue — waiting postings, numbered (only one is shown at a time)
    /show &lt;n&gt; — show posting n of /queue now; the shown posting goes back to the queue
    /rules — numbered rejection rules (date, reason, link to the original posting)
    /rule del 2 5-7 — delete these rules (after /rules, with confirmation)
    /go &lt;ID&gt; [ID…] — prepare the application (CV + offre.pdf, as a reply to the alert)
    /sent &lt;ID&gt; — application sent: CSV "applied", files removed from Telegram (S…: spontaneous); then the next posting
    /cancel &lt;ID&gt; — give up: posting closed, never proposed again; then the next posting
    /reply &lt;ID&gt; yes|no — answer received (yes = positive, no = refusal): CSV status, follow-up reminders stopped; S…: keep or purge the contact
    /pending — prepared applications not sent yet ("resend the files" button)
    /company &lt;name&gt; — applications at this company
    /allow 1 3-5 | /allow all — approve pending sites (numbers from the recap)
    /deny 4 — refuse a pending site (never proposed again)
    /sites — numbered list of pending sites
    /spont &lt;company&gt; — prepare a spontaneous application (e-mail + LinkedIn drafts, CV); nothing is sent
    /discover &lt;region&gt; — look for new companies (proposals to approve)
    /companies — proposed companies, numbered
    /accept 1 3-5 | /reject 2 — approve or drop proposals (dropped = never proposed again)
    /block &lt;company&gt; — exclude the company from every search
    /blocked — blocked companies, numbered
    /unblock &lt;n&gt; — unblock one company (number from /blocked)
    /region on|off &lt;name&gt; — enable/disable a region (<code>remote</code> = remote worldwide)
    /regions — list of regions
    /status — last run, next run, active alerts
    /rejects — IT postings dropped in the last run (non-IT hidden)
    /health — full check (secrets, Telegram, bun, lualatex, disk, whitelist, Claude token)
    /lang [en|fr] — message language
    Same commands: /file = /queue, /voir = /show, /rejets = /rejects, /firma = /company
    /help — this help

