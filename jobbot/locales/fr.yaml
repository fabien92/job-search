# JobBot — textes des messages Telegram, en français.
# Mêmes clés que en.yaml (langue de référence ; toute clé absente ici est prise dans en.yaml).
# {nom} = valeur insérée par le code ; écrire {{ ou }} pour une accolade littérale.
# HTML Telegram autorisé : <b>, <i>, <code>, <a href>. Écrire &lt; et &gt; pour < et >.
# Langue choisie avec /lang (enregistrée dans state/settings.json).

lang:
  self_name: "Français"
  current: "Langue : <b>{name}</b> ({code}). Changer : /lang {choices}"
  set: "Langue : <b>{name}</b>. Les messages de JobBot sont maintenant en français."
  unknown: "Langue inconnue : {code}. Choix : {choices}"

bot:
  busy: "État occupé (verrou) ; réessaie dans un instant."
  error: "Erreur : {name}"
  unknown_command: "Commande inconnue. /help"
  corrupt_state: "⚠️ Fichier d'état <code>{file}</code> illisible (JSON invalide). Rien n'a été modifié. Restaure-le depuis la sauvegarde ou répare-le à la main, puis réessaie."
  tracker_malformed: "⚠️ Suivi non mis à jour : la ligne {line} ({company}) contient plus de cellules que l'en-tête (une virgule sans guillemets ?). Répare job_search_tracker.csv, puis renvoie la commande."
  needs_claude: "Cette commande a besoin de Claude : elle est indisponible avec <code>scoring: rules</code> (voir schedule.yaml)."

help:
  text: |-
    <b>JobBot — commandes</b>
    /search &lt;site|all&gt; — recherche immédiate ({portals}, all)
    /no &lt;ID&gt; [motif] — rejette l'offre ; le motif (facultatif) enrichit rejection-rules.md ; offre affichée → la suivante arrive
    /file — offres en attente, numérotées (une seule est affichée à la fois)
    /voir &lt;n&gt; — affiche tout de suite l'offre n de /file ; l'offre affichée retourne dans la file
    /rules — règles de rejet numérotées (date, motif, lien de l'offre d'origine)
    /rule del 2 5-7 — supprime ces règles (après /rules, avec confirmation)
    /go &lt;ID&gt; [ID…] — prépare la candidature (CV + offre.pdf, en réponse à l'alerte)
    /sent &lt;ID&gt; — candidature envoyée : CSV « applied », fichiers retirés de Telegram (S… : spontanée) ; puis offre suivante
    /cancel &lt;ID&gt; — abandon : offre close, plus jamais proposée ; puis offre suivante
    /reply &lt;ID&gt; oui|non — réponse reçue (oui = positive, non = refus) : statut du CSV, rappels de relance arrêtés ; S… : garder ou purger le contact
    /pending — candidatures préparées non envoyées (bouton « renvoyer les fichiers »)
    /firma &lt;nom&gt; — candidatures dans cette entreprise
    /allow 1 3-5 | /allow all — valide des sites en attente (numéros du récapitulatif)
    /deny 4 — refuse un site en attente (jamais reproposé)
    /sites — liste numérotée des sites en attente
    /spont &lt;entreprise&gt; — prépare une candidature spontanée (brouillons e-mail + LinkedIn, CV) ; rien n'est envoyé
    /discover &lt;région&gt; — cherche de nouvelles entreprises (propositions à valider)
    /companies — entreprises proposées, numérotées
    /accept 1 3-5 | /reject 2 — valide ou écarte des propositions (écartée = jamais reproposée)
    /block &lt;entreprise&gt; — exclut l'entreprise de toutes les recherches
    /blocked — entreprises bloquées, numérotées
    /unblock &lt;n&gt; — débloque une seule entreprise (numéro de /blocked)
    /region on|off &lt;nom&gt; — active/désactive une région (<code>remote</code> = télétravail monde)
    /regions — liste des régions
    /status — dernier passage, prochain passage, alertes en cours
    /rejets — offres IT éliminées au dernier passage (hors IT masqué)
    /health — contrôle complet (secrets, Telegram, bun, lualatex, disque, liste blanche, jeton Claude)
    /lang [en|fr] — langue des messages
    Mêmes commandes en anglais : /queue = /file, /show = /voir, /rejects = /rejets, /company = /firma
    /help — cette aide

